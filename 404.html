<link rel="stylesheet" href="css/style.css">
<script>
  // Old Shopify links (gulfcoastcharm.com/products/..., /collections/..., /cart, etc.)
  // land here after the store moves to shop.gulfcoastcharm.com — forward them.
  (function () {
    var p = window.location.pathname;
    if (/^\/(products|collections|cart|pages|blogs|checkout|account)(\/|$)/.test(p)) {
      window.location.replace("https://shop.gulfcoastcharm.com" + p + window.location.search);
    }
  })();
</script>
